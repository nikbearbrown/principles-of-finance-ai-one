<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="720" height="430" viewBox="0 0 720 430">
<title id="title">The path can matter more than the endpoint</title>
<desc id="desc">Fictional balances in dollars. Equity-like series: 100, 115, 86.25, 103.50, 113.85. Steady series: 100, 103, 106.09, 109.27, 112.55. The first series takes a dip in year two.</desc>
<rect width="720" height="430" fill="#FFFFFF"/>
<g font-family="Inter, Helvetica Neue, Arial, sans-serif" fill="#2a1a0e" font-size="17">
<text x="42" y="38" font-size="27">The path can matter more than the endpoint</text>
<text x="42" y="62" fill="#545454">Fictional balances, in dollars · no deposits or withdrawals</text>
<g transform="translate(0, 14)"><path d="M112 274.0H608" stroke="#D4D4D4"/><text x="99" y="279.0" text-anchor="end">80</text><path d="M112 222.0H608" stroke="#D4D4D4"/><text x="99" y="227.0" text-anchor="end">90</text><path d="M112 170.0H608" stroke="#D4D4D4"/><text x="99" y="175.0" text-anchor="end">100</text><path d="M112 118.0H608" stroke="#D4D4D4"/><text x="99" y="123.0" text-anchor="end">110</text><path d="M112 66.0H608" stroke="#D4D4D4"/><text x="99" y="71.0" text-anchor="end">120</text>
<path d="M112 66V274H608" stroke="#545454" fill="none" stroke-width="1.3"/>
<polyline id="equity" points="112,170.000 236,92.000 360,241.500 484,151.800 608,97.980" fill="none" stroke="#C8102E" stroke-width="3.5"/>
<polyline id="steady" points="112,170.000 236,154.400 360,138.332 484,121.782 608,104.735" fill="none" stroke="#2a1a0e" stroke-dasharray="9 6" stroke-width="3.5"/><circle cx="112" cy="170.000" r="4" fill="#C8102E"/><circle cx="236" cy="92.000" r="4" fill="#C8102E"/><circle cx="360" cy="241.500" r="4" fill="#C8102E"/><circle cx="484" cy="151.800" r="4" fill="#C8102E"/><circle cx="608" cy="97.980" r="4" fill="#C8102E"/><text x="112" y="304" text-anchor="middle">Start</text><text x="236" y="304" text-anchor="middle">Y1</text><text x="360" y="304" text-anchor="middle">Y2</text><text x="484" y="304" text-anchor="middle">Y3</text><text x="608" y="304" text-anchor="middle">Y4</text></g>
